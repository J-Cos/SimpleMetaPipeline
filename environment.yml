name: SimpleMetaPipeline-env

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - r-base=4.2
  - r-tidyverse=2.0
  - vsearch=2.14
  - swarm=3.1
  - cutadapt=4.5
  - blast=2.5
  - bioconductor-dada2=1.26
  - r-seqinr=4.2
  - bioconductor-decipher=2.26
  - r-gridextra=2.3
  - bioconductor-shortread=1.56
  - bioconductor-biostrings=2.66
  - r-devtools=2.4
  - r-cli=3.6
  - r-rlang=1.1
  - r-testthat=3.2

# R packages not available on any conda channel are installed from GitHub
# via devtools the first time you run the pipeline:
#   - lulu (https://github.com/tobiasgf/lulu)